name: cache-pressure-verify

on:
  push:
    branches:
      - feature/cache-eviction-restore-benchmark
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pydantic PyYAML psutil requests prometheus-client
      - run: python -m pytest -q benchmarks/cache/tests
      - run: python -m compileall -q benchmarks/cache
