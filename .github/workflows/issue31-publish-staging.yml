name: Issue31 CI-fix staged publisher

on:
  push:
    branches:
      - agent/issue31-publish-staging-20260813

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Reproduce and publish local CI-fix commit exactly
        shell: bash
        run: |
          set -euo pipefail

          TARGET='agent/issue31-fs-hard-capacity'
          PARENT='4740c6b2e3ee545b5940f9cffed7dca5b4a39945'
          EXPECTED_TREE='be44a5369d014597cbfbc9048e12376a6bb6f2e2'
          EXPECTED_COMMIT='2752b4950f0f30eedbb7f6bb3b60a83512a012c4'

          remote_head="$(git ls-remote origin "refs/heads/${TARGET}" | awk '{print $1}')"
          test "${remote_head}" = "${PARENT}"

          git fetch origin "${TARGET}"
          git checkout --detach "${PARENT}"

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected exact block once, found {count}"
                  )
              path.write_text(text.replace(old, new, 1))

          config = Path(
              "benchmarks/cache/tests/test_issue31_fs_capacity_config.py"
          )
          text = config.read_text()
          header = (
              "# SPDX-License-Identifier: Apache-2.0\n"
              "# SPDX-FileCopyrightText: Copyright contributors to the vLLM project\n"
              "\n"
          )
          if not text.startswith("# SPDX-License-Identifier:"):
              config.write_text(header + text)

          replace_once(
              config,
              '''        for value in (None, 0, -1, True, 4096.0, "4096"):\n            with self.subTest(value=value):\n                with self.assertRaises(ValidationError):\n                    FilesystemCacheConfig(\n                        enabled=True,\n                        root_dir=Path("/tmp/cache"),\n                        max_bytes=value,\n                    )\n''',
              '''        for value in (None, 0, -1, True, 4096.0, "4096"):\n            with self.subTest(value=value), self.assertRaises(ValidationError):\n                FilesystemCacheConfig(\n                    enabled=True,\n                    root_dir=Path("/tmp/cache"),\n                    max_bytes=value,\n                )\n''',
          )

          capacity = Path("vllm/v1/kv_offload/tiering/fs/capacity.py")
          replace_once(capacity, "import re\n", "import regex as re\n")

          tests = Path("tests/v1/kv_offload/tiering/test_fs_capacity.py")
          replace_once(
              tests,
              '''        order = []\n\n        manager = object.__new__(fs_manager.FileSystemTierManager)\n''',
              '''        order: list[str | tuple[str, bool]] = []\n\n        manager = object.__new__(fs_manager.FileSystemTierManager)\n''',
          )

          replace_once(
              tests,
              '''        with mock.patch.object(\n            fs_io.os,\n            "open",\n            side_effect=FileNotFoundError("injected read failure"),\n        ):\n            with mock.patch.object(fs_io.os, "remove") as remove:\n                with self.assertRaises(FileNotFoundError):\n                    fs_io.load_block(\n                        str(final_path),\n                        memoryview(target),\n                        0,\n                        4,\n                    )\n''',
              '''        with (\n            mock.patch.object(\n                fs_io.os,\n                "open",\n                side_effect=FileNotFoundError("injected read failure"),\n            ),\n            mock.patch.object(fs_io.os, "remove") as remove,\n            self.assertRaises(FileNotFoundError),\n        ):\n            fs_io.load_block(\n                str(final_path),\n                memoryview(target),\n                0,\n                4,\n            )\n''',
          )

          replace_once(
              tests,
              '''        with mock.patch.object(\n            fs_io.os,\n            "open",\n            side_effect=fake_open,\n        ):\n            with mock.patch.object(\n                fs_io.os,\n                "write",\n                return_value=4,\n            ):\n                with mock.patch.object(fs_io.os, "close"):\n                    with mock.patch.object(fs_io.os, "replace") as replace:\n                        with mock.patch.object(\n                            fs_io,\n                            "_ensure_dirs",\n                        ) as ensure_dirs:\n                            with mock.patch.object(\n                                fs_io.os.path,\n                                "exists",\n                                side_effect=AssertionError(\n                                    "raw store must not check "\n                                    "destination existence"\n                                ),\n                            ):\n                                fs_io.store_block(\n                                    str(final_path),\n                                    str(temp_path),\n                                    memoryview(payload),\n                                    0,\n                                    4,\n                                )\n''',
              '''        with (\n            mock.patch.object(\n                fs_io.os,\n                "open",\n                side_effect=fake_open,\n            ),\n            mock.patch.object(\n                fs_io.os,\n                "write",\n                return_value=4,\n            ),\n            mock.patch.object(fs_io.os, "close"),\n            mock.patch.object(fs_io.os, "replace") as replace,\n            mock.patch.object(\n                fs_io,\n                "_ensure_dirs",\n            ) as ensure_dirs,\n            mock.patch.object(\n                fs_io.os.path,\n                "exists",\n                side_effect=AssertionError(\n                    "raw store must not check "\n                    "destination existence"\n                ),\n            ),\n        ):\n            fs_io.store_block(\n                str(final_path),\n                str(temp_path),\n                memoryview(payload),\n                0,\n                4,\n            )\n''',
          )

          replace_once(
              tests,
              '''        with mock.patch.object(fs_io.os, "open", return_value=17):\n            with mock.patch.object(\n                fs_io.os,\n                "write",\n                side_effect=OSError("injected write failure"),\n            ):\n                with mock.patch.object(fs_io.os, "close"):\n                    with mock.patch.object(fs_io.os, "remove") as remove:\n                        with self.assertRaisesRegex(\n                            OSError,\n                            "injected write failure",\n                        ):\n                            fs_io.store_block(\n                                str(final_path),\n                                str(temp_path),\n                                memoryview(payload),\n                                0,\n                                4,\n                            )\n''',
              '''        with (\n            mock.patch.object(fs_io.os, "open", return_value=17),\n            mock.patch.object(\n                fs_io.os,\n                "write",\n                side_effect=OSError("injected write failure"),\n            ),\n            mock.patch.object(fs_io.os, "close"),\n            mock.patch.object(fs_io.os, "remove") as remove,\n            self.assertRaisesRegex(\n                OSError,\n                "injected write failure",\n            ),\n        ):\n            fs_io.store_block(\n                str(final_path),\n                str(temp_path),\n                memoryview(payload),\n                0,\n                4,\n            )\n''',
          )

          print("manual_ci_gate_fixes=OK")
          PY

          files=(
            benchmarks/cache/config.py
            benchmarks/cache/issue31_fs_capacity_smoke.py
            benchmarks/cache/tests/test_issue31_fs_capacity_config.py
            benchmarks/cache/tests/test_issue31_fs_capacity_smoke.py
            docs/superpowers/plans/2026-08-12-issue31-filesystem-kv-cache-hard-capacity.md
            docs/superpowers/specs/2026-08-12-filesystem-kv-cache-hard-capacity-design.md
            tests/v1/kv_offload/tiering/test_fs_capacity.py
            tests/v1/kv_offload/tiering/test_fs_capacity_restart.py
            tests/v1/kv_offload/tiering/test_fs_tier.py
            tests/v1/kv_offload/tiering/test_shadow_cost_spec.py
            vllm/v1/kv_offload/tiering/fs/capacity.py
            vllm/v1/kv_offload/tiering/fs/io.py
            vllm/v1/kv_offload/tiering/fs/manager.py
          )

          run_modifying_hook() {
            local hook="$1"
            set +e
            pre-commit run "${hook}" --files "${files[@]}" --hook-stage manual
            local rc=$?
            set -e
            if [[ "${rc}" -ne 0 && "${rc}" -ne 1 ]]; then
              echo "${hook}: unexpected first-pass exit ${rc}" >&2
              return "${rc}"
            fi
          }

          run_modifying_hook ruff-check
          run_modifying_hook ruff-format
          run_modifying_hook markdownlint-cli2
          pre-commit run check-spdx-header --files "${files[@]}" --hook-stage manual
          pre-commit run check-forbidden-imports --files "${files[@]}" --hook-stage manual

          pre-commit run ruff-check --files "${files[@]}" --hook-stage manual
          pre-commit run ruff-format --files "${files[@]}" --hook-stage manual
          pre-commit run markdownlint-cli2 --files "${files[@]}" --hook-stage manual
          pre-commit run check-spdx-header --files "${files[@]}" --hook-stage manual
          pre-commit run check-forbidden-imports --files "${files[@]}" --hook-stage manual

          printf '%s\n' "${files[@]}" | LC_ALL=C sort > /tmp/expected-files.txt
          git diff --name-only | LC_ALL=C sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          git add -- "${files[@]}"
          git diff --cached --check

          tree="$(git write-tree)"
          echo "reproduced_tree=${tree}"
          test "${tree}" = "${EXPECTED_TREE}"

          export GIT_AUTHOR_NAME='Your Name'
          export GIT_AUTHOR_EMAIL='you@example.com'
          export GIT_AUTHOR_DATE='2026-08-13T16:13:56+08:00'
          export GIT_COMMITTER_NAME='Your Name'
          export GIT_COMMITTER_EMAIL='you@example.com'
          export GIT_COMMITTER_DATE='2026-08-13T16:13:56+08:00'

          commit="$(printf '%s\n' 'fix: satisfy issue 31 CI quality gates' | git commit-tree "${tree}" -p "${PARENT}")"
          echo "reproduced_commit=${commit}"
          test "${commit}" = "${EXPECTED_COMMIT}"

          git push origin "${commit}:refs/heads/${TARGET}"
          echo 'issue31_ci_fix_publish=OK'
