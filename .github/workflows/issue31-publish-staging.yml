name: issue31 publish staging

on:
  push:
    branches:
      - agent/issue31-publish-staging-20260813

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Reproduce and publish docs-only commit
        shell: bash
        run: |
          set -euo pipefail
          BASE=2752b4950f0f30eedbb7f6bb3b60a83512a012c4
          EXPECTED_TREE=9927c0f9204a60a49212fc81318ce9f69d63f879
          EXPECTED_COMMIT=66fc997ed55db5cb99fa12dcb5213a3d57f34ff9
          TARGET=agent/issue31-fs-hard-capacity

          cp .github/scripts/issue31_refresh_docs.py /tmp/issue31_refresh_docs.py
          git fetch origin "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git checkout --detach "$BASE"
          python /tmp/issue31_refresh_docs.py

          git add docs/engineering/CURRENT_STATE.md \
                  docs/engineering/validation/2026-08-12-issue31-filesystem-hard-capacity-validation.json \
                  docs/engineering/validation/2026-08-12-issue31-filesystem-hard-capacity-validation.md
          git diff --cached --check
          TREE=$(git write-tree)
          echo "reproduced_tree=$TREE"
          test "$TREE" = "$EXPECTED_TREE"

          export GIT_AUTHOR_NAME='Your Name'
          export GIT_AUTHOR_EMAIL='you@example.com'
          export GIT_AUTHOR_DATE='2026-08-13T18:04:36+08:00'
          export GIT_COMMITTER_NAME='Your Name'
          export GIT_COMMITTER_EMAIL='you@example.com'
          export GIT_COMMITTER_DATE='2026-08-13T18:04:36+08:00'
          COMMIT=$(git commit-tree "$TREE" -p "$BASE" -m 'docs: refresh issue 31 delivery status')
          echo "reproduced_commit=$COMMIT"
          test "$COMMIT" = "$EXPECTED_COMMIT"

          git push origin "$COMMIT:refs/heads/$TARGET"
