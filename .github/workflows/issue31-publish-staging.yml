name: issue31 publication staging

on:
  push:
    branches:
      - agent/issue31-publish-staging-20260813

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild verified patch series and publish
        shell: bash
        run: |
          set -euo pipefail

          cat .issue31-upload/*.b64 | tr -d '\n' | base64 -d > /tmp/issue31.mbox.gz
          echo "a42a01684d89ff41ba4298e14e7de99133e31fb6fd1d13223f3d3cc012e98f91  /tmp/issue31.mbox.gz" | sha256sum -c -
          gzip -dc /tmp/issue31.mbox.gz > /tmp/issue31.mbox

          git fetch origin agent/issue31-fs-hard-capacity
          git checkout -B issue31-publish origin/agent/issue31-fs-hard-capacity
          test "$(git rev-parse HEAD)" = "eea0ff4b16711693b6f9945a4a808916990442ee"

          git config user.name "Your Name"
          git config user.email "you@example.com"
          git config commit.gpgsign false
          git am --committer-date-is-author-date /tmp/issue31.mbox

          test "$(git rev-list --count eea0ff4b16711693b6f9945a4a808916990442ee..HEAD)" = "10"
          test "$(git rev-parse HEAD)" = "4740c6b2e3ee545b5940f9cffed7dca5b4a39945"

          while read -r expected path; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected"
