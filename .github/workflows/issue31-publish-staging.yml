          META
          test "${#metadata[@]}" = "10"
          for i in "${!patches[@]}"; do
            read -r expected_sha expected_tree committer_date <<< "${metadata[$i]}"
            GIT_COMMITTER_NAME="Your Name" GIT_COMMITTER_EMAIL="you@example.com" GIT_COMMITTER_DATE="$committer_date" git am "${patches[$i]}"
            actual_sha="$(git rev-parse HEAD)"
            actual_tree="$(git rev-parse HEAD^{tree})"
            echo "replayed[$i]=$actual_sha tree=$actual_tree"
            test "$actual_sha" = "$expected_sha"
            test "$actual_tree" = "$expected_tree"
