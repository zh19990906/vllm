name: upstream-final-store-backport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cherry-pick-upstream:
    if: github.head_ref == 'fix/kv-offload-final-store-lifecycle-backport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Cherry-pick official vLLM fix
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'finished_signaled: bool = False' vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py; then
            echo 'Official fix is already present; nothing to do.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/vllm-project/vllm.git
          git fetch upstream d30b1ecd1bdf7c3d92f3b444c4538efd8fbb40ac
          git cherry-pick d30b1ecd1bdf7c3d92f3b444c4538efd8fbb40ac
          git push origin HEAD:${GITHUB_HEAD_REF}
