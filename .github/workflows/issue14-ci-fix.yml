name: issue14-ci-fix

on:
  push:
    branches:
      - calibration/issue14-shadow-cost-model

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: calibration/issue14-shadow-cost-model
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12'

      - name: Apply semantic CI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              file_path.write_text(text.replace(old, new, 1))

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          marker = "[tool.typos.default.extend-words]\n"
          if 'MAPE = "MAPE"' not in text:
              if marker not in text:
                  raise SystemExit("typos extend-words section not found")
              text = text.replace(
                  marker,
                  marker + 'MAPE = "MAPE"\nmape = "mape"\n',
                  1,
              )
              pyproject.write_text(text)

          replace_once(
              "tests/v1/kv_offload/test_cost_model.py",
              "\nPROFILE = {\n",
              "\nPROFILE: dict[str, Any] = {\n",
          )

          design = "docs/superpowers/specs/2026-08-10-issue14-shadow-cost-model-calibration-design.md"
          replacements = [
              ("\n#12 introduced ", "\nIssue #12 introduced "),
              ("\n#13 produced ", "\nIssue #13 produced "),
              ("\n#14 does not initially change ", "\nIssue #14 does not initially change "),
              ("\n#16 may only enable ", "\nIssue #16 may only enable "),
              ("\n#14 is complete when ", "\nIssue #14 is complete when "),
          ]
          for old, new in replacements:
              replace_once(design, old, new)
          PY

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Apply and verify markdownlint fixes
        shell: bash
        run: |
          files=(
            docs/engineering/validation/2026-08-10-issue13-restore-recompute-crossover.md
            docs/engineering/validation/2026-08-10-issue14-shadow-cost-model-calibration.md
            docs/superpowers/plans/2026-08-10-issue14-shadow-cost-model-calibration.md
            docs/superpowers/specs/2026-08-10-issue14-shadow-cost-model-calibration-design.md
          )
          pre-commit run markdownlint-cli2 --hook-stage manual --files "${files[@]}" || true
          pre-commit run markdownlint-cli2 --hook-stage manual --files "${files[@]}"

      - name: Apply and verify SPDX headers
        shell: bash
        run: |
          files=(
            benchmarks/cache/cost_model_calibration.py
            benchmarks/cache/evaluate_cost_model.py
            benchmarks/cache/tests/test_cost_model_calibration.py
          )
          pre-commit run check-spdx-header --hook-stage manual --files "${files[@]}" || true
          pre-commit run check-spdx-header --hook-stage manual --files "${files[@]}"

      - name: Verify focused static checks
        shell: bash
        run: |
          python_files=(
            benchmarks/cache/cost_model_calibration.py
            benchmarks/cache/evaluate_cost_model.py
            benchmarks/cache/tests/test_cost_model_calibration.py
            tests/v1/kv_offload/test_cost_model.py
          )
          typo_files=(
            pyproject.toml
            "${python_files[@]}"
            docs/engineering/validation/2026-08-10-issue14-shadow-cost-model-calibration.json
            docs/engineering/validation/2026-08-10-issue14-shadow-cost-model-calibration.md
            docs/superpowers/plans/2026-08-10-issue14-shadow-cost-model-calibration.md
            docs/superpowers/specs/2026-08-10-issue14-shadow-cost-model-calibration-design.md
          )
          pre-commit run ruff-check --hook-stage manual --files "${python_files[@]}"
          pre-commit run ruff-format --hook-stage manual --files "${python_files[@]}"
          pre-commit run typos --hook-stage manual --files "${typo_files[@]}"
          pre-commit run mypy-3.12 --hook-stage manual --files tests/v1/kv_offload/test_cost_model.py
          git diff --check

      - name: Commit focused fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue14-ci-fix.yml
          git add \
            .github/workflows/issue14-ci-fix.yml \
            pyproject.toml \
            benchmarks/cache/cost_model_calibration.py \
            benchmarks/cache/evaluate_cost_model.py \
            benchmarks/cache/tests/test_cost_model_calibration.py \
            tests/v1/kv_offload/test_cost_model.py \
            docs/engineering/validation/2026-08-10-issue13-restore-recompute-crossover.md \
            docs/engineering/validation/2026-08-10-issue14-shadow-cost-model-calibration.md \
            docs/superpowers/plans/2026-08-10-issue14-shadow-cost-model-calibration.md \
            docs/superpowers/specs/2026-08-10-issue14-shadow-cost-model-calibration-design.md
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy issue 14 pre-commit checks"
          git push origin HEAD:calibration/issue14-shadow-cost-model
