name: shadow-cost-model-pr-tdd

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-ruff-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kv-offload-shadow-cost-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.14.0
      - name: Apply focused safe fixes
        run: |
          test -f .github/shadow-ruff-fix-trigger
          python - <<'PY'
          from pathlib import Path

          provenance = Path(
              'tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py'
          )
          text = provenance.read_text()
          old = '''    manager = _load(\n        "vllm.v1.kv_offload.tiering.manager",\n        _REPO_ROOT / "vllm" / "v1" / "kv_offload" / "tiering" / "manager.py",\n    )'''
          new = '''    _load(\n        "vllm.v1.kv_offload.tiering.manager",\n        _REPO_ROOT / "vllm" / "v1" / "kv_offload" / "tiering" / "manager.py",\n    )'''
          if text.count(old) != 1:
              raise SystemExit('provenance unused manager anchor did not match once')
          provenance.write_text(text.replace(old, new))

          scheduler = Path(
              'tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py'
          )
          text = scheduler.read_text()
          old = '''    base = _load(\n        "vllm.v1.kv_offload.base",\n        _REPO_ROOT / "vllm" / "v1" / "kv_offload" / "base.py",\n    )'''
          new = '''    _load(\n        "vllm.v1.kv_offload.base",\n        _REPO_ROOT / "vllm" / "v1" / "kv_offload" / "base.py",\n    )'''
          if text.count(old) != 1:
              raise SystemExit('scheduler unused base anchor did not match once')
          scheduler.write_text(text.replace(old, new))
          PY

          FILES=(
            vllm/v1/kv_offload/cost_model.py
            vllm/v1/kv_offload/base.py
            vllm/v1/kv_offload/tiering/spec.py
            vllm/v1/kv_offload/tiering/manager.py
            vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py
            vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py
            tests/v1/kv_offload/test_cost_model.py
            tests/v1/kv_offload/tiering/test_shadow_cost_spec.py
            tests/v1/kv_offload/tiering/test_shadow_cost_tier_config.py
            tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py
            tests/v1/kv_offload/tiering/test_shadow_cost_promotion_timing.py
            tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py
          )
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"
      - name: Commit focused Ruff fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            vllm/v1/kv_offload/cost_model.py \
            vllm/v1/kv_offload/base.py \
            vllm/v1/kv_offload/tiering/spec.py \
            vllm/v1/kv_offload/tiering/manager.py \
            vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py \
            vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py \
            tests/v1/kv_offload/test_cost_model.py \
            tests/v1/kv_offload/tiering/test_shadow_cost_spec.py \
            tests/v1/kv_offload/tiering/test_shadow_cost_tier_config.py \
            tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py \
            tests/v1/kv_offload/tiering/test_shadow_cost_promotion_timing.py \
            tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py
          git diff --cached --check
          git commit -m 'style: format KV offload shadow model'
          git push origin HEAD:feature/kv-offload-shadow-cost-model

  focused:
    needs: apply-ruff-fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kv-offload-shadow-cost-model
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test and lint dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff==0.14.0
      - name: Run Task 1 cost model tests
        run: |
          cd /tmp
          python -m pytest -q \
            --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/test_cost_model.py"
      - name: Run Task 2 spec wiring tests
        run: |
          cd /tmp
          python -m pytest -q \
            --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_spec.py"
      - name: Run Task 2 tier runtime config test
        run: |
          cd /tmp
          python -m pytest -q \
            --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_tier_config.py"
      - name: Run Task 3 provenance tests
        run: |
          cd /tmp
          python -m pytest -q \
            --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py"
      - name: Run Task 3 deferred timing test
        run: |
          cd /tmp
          python -m pytest -q \
            --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_promotion_timing.py"
      - name: Run Task 4 scheduler shadow tests
        run: |
          cd /tmp
          python -m pytest -q \
            --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py"
      - name: Compile implemented runtime modules
        run: >-
          python -m compileall -q
          vllm/v1/kv_offload/cost_model.py
          vllm/v1/kv_offload/base.py
          vllm/v1/kv_offload/tiering/spec.py
          vllm/v1/kv_offload/tiering/manager.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py
      - name: Ruff check touched Python files
        run: >-
          ruff check
          vllm/v1/kv_offload/cost_model.py
          vllm/v1/kv_offload/base.py
          vllm/v1/kv_offload/tiering/spec.py
          vllm/v1/kv_offload/tiering/manager.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py
          tests/v1/kv_offload/test_cost_model.py
          tests/v1/kv_offload/tiering/test_shadow_cost_spec.py
          tests/v1/kv_offload/tiering/test_shadow_cost_tier_config.py
          tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py
          tests/v1/kv_offload/tiering/test_shadow_cost_promotion_timing.py
          tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py
      - name: Ruff format check touched Python files
        run: >-
          ruff format --check
          vllm/v1/kv_offload/cost_model.py
          vllm/v1/kv_offload/base.py
          vllm/v1/kv_offload/tiering/spec.py
          vllm/v1/kv_offload/tiering/manager.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py
          tests/v1/kv_offload/test_cost_model.py
          tests/v1/kv_offload/tiering/test_shadow_cost_spec.py
          tests/v1/kv_offload/tiering/test_shadow_cost_tier_config.py
          tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py
          tests/v1/kv_offload/tiering/test_shadow_cost_promotion_timing.py
          tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py
