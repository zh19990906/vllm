name: shadow-cost-model-pr-tdd

on:
  pull_request:
    branches:
      - main

jobs:
  task1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Prepare pure-Python vllm package stub
        run: |
          mkdir -p /tmp/vllm-pure-stub/vllm
          cat > /tmp/vllm-pure-stub/vllm/__init__.py <<'PY'
          from pkgutil import extend_path
          __path__ = extend_path(__path__, __name__)
          PY
      - name: Run Task 1 cost model tests
        env:
          PYTHONPATH: /tmp/vllm-pure-stub:${{ github.workspace }}
        run: |
          cd /tmp
          python -m pytest -q \
            --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/test_cost_model.py"
