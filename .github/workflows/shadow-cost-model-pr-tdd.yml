name: shadow-cost-model-pr-tdd

on:
  pull_request:
    branches:
      - main

jobs:
  task1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Task 1 cost model tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          --confcutdir=tests/v1/kv_offload
          tests/v1/kv_offload/test_cost_model.py
