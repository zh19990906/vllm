name: shadow-cost-model-pr-tdd

on:
  pull_request:
    branches:
      - main

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff==0.14.0
      - name: Run focused tests
        run: |
          cd /tmp
          for test_file in \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/test_cost_model.py" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_spec.py" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_tier_config.py" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_promotion_timing.py" \
            "${GITHUB_WORKSPACE}/tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py"
          do
            python -m pytest -q \
              --confcutdir="${GITHUB_WORKSPACE}/tests/v1/kv_offload" \
              "$test_file"
          done
      - name: Compile runtime modules
        run: >-
          python -m compileall -q
          vllm/v1/kv_offload/cost_model.py
          vllm/v1/kv_offload/base.py
          vllm/v1/kv_offload/tiering/spec.py
          vllm/v1/kv_offload/tiering/manager.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py
          vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py
      - name: Ruff check and format
        run: |
          FILES=(
            vllm/v1/kv_offload/cost_model.py
            vllm/v1/kv_offload/base.py
            vllm/v1/kv_offload/tiering/spec.py
            vllm/v1/kv_offload/tiering/manager.py
            vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py
            vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py
            tests/v1/kv_offload/test_cost_model.py
            tests/v1/kv_offload/tiering/test_shadow_cost_spec.py
            tests/v1/kv_offload/tiering/test_shadow_cost_tier_config.py
            tests/v1/kv_offload/tiering/test_shadow_cost_provenance.py
            tests/v1/kv_offload/tiering/test_shadow_cost_promotion_timing.py
            tests/v1/kv_offload/tiering/test_shadow_cost_scheduler.py
          )
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
