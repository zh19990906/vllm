name: Cache workload fairness verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: cache-workload-fairness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workload-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -U pytest pydantic PyYAML
      - name: Run fairness RED tests
        run: >-
          python -m pytest -q benchmarks/cache/tests/test_workload.py
          -k 'matching_cache_modes or execution_controls'
