name: Cache workload fairness verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: cache-workload-fairness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workload-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: >-
          python -m pip install -U pytest pydantic PyYAML requests psutil
          prometheus-client
      - name: Patch existing fake executable fixture in runner only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('benchmarks/cache/tests/test_run_suite.py')
          text = path.read_text(encoding='utf-8')
          old = r"body = b'vllm:prefix_cache_hit_tokens_total 10\n'"
          new = r"body = b'vllm:prefix_cache_hit_tokens_total 10\\n'"
          assert old in text
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run cache benchmark tests
        run: python -m pytest -q benchmarks/cache/tests
      - name: Compile cache benchmark package
        run: python -m compileall -q benchmarks/cache
