name: cache-search-red-green

on:
  pull_request:
  push:
    branches:
      - feature/cache-eviction-restore-benchmark

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest pydantic PyYAML psutil requests prometheus-client
      - name: Patch pre-existing fake E2E fixture escaping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("benchmarks/cache/tests/test_run_suite.py")
          text = path.read_text(encoding="utf-8")
          old = r"body = b'vllm:prefix_cache_hit_tokens_total 10\n'"
          new = r"body = b'vllm:prefix_cache_hit_tokens_total 10\\n'"
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - run: python -m pytest -q benchmarks/cache/tests
      - run: python -m compileall -q benchmarks/cache
