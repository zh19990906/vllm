name: tdd-population-result-red

on:
  push:
    branches:
      - feature/cache-eviction-restore-benchmark

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest pydantic PyYAML psutil requests prometheus-client
      - name: Add regression test only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('benchmarks/cache/tests/test_run_suite.py')
          text = path.read_text()
          function_name = 'def test_population_result_failure_stops_before_measurement('
          if function_name in text:
              raise SystemExit(0)
          marker = '\ndef test_restart_persistence_restarts_before_measured_run(\n'
          assert marker in text
          test = r'''

def test_population_result_failure_stops_before_measurement(
    monkeypatch, valid_config_dict: dict, tmp_path: Path
) -> None:
    from benchmarks.cache import run_suite

    config_path = _write_config(tmp_path, valid_config_dict)
    config = yaml.safe_load(config_path.read_text())
    config["workload"]["workload_kinds"] = ["warm-exact-prefix"]
    config["workload"]["requests_per_case"] = 24
    config_path.write_text(yaml.safe_dump(config), encoding="utf-8")

    monkeypatch.setattr(run_suite, "load_tokenizer", lambda config: FakeTokenizer())
    monkeypatch.setattr(run_suite, "collect_environment_evidence", lambda: {})
    monkeypatch.setattr(
        run_suite,
        "fetch_prometheus_snapshot",
        lambda base_url: pytest.fail("metrics collection should not start"),
    )
    monkeypatch.setattr(
        run_suite,
        "start_server",
        lambda command, **kwargs: SimpleNamespace(
            command=tuple(command), process=SimpleNamespace(pid=123, poll=lambda: None)
        ),
    )
    monkeypatch.setattr(run_suite, "wait_for_server", lambda *args, **kwargs: None)
    monkeypatch.setattr(run_suite, "stop_server", lambda *args, **kwargs: None)

    calls = 0

    def fake_run(command, *, env, stdout_path, stderr_path, timeout_seconds):
        nonlocal calls
        calls += 1
        if calls > 1:
            pytest.fail("measured benchmark should not start")
        result_path = Path(command[command.index("--result-dir") + 1]) / command[
            command.index("--result-filename") + 1
        ]
        result_path.parent.mkdir(parents=True, exist_ok=True)
        result_path.write_text(
            json.dumps({"completed": 20, "failed": 4}), encoding="utf-8"
        )
        return _command_result(command, stdout_path, stderr_path)

    monkeypatch.setattr(run_suite, "run_command", fake_run)

    exit_code = run_suite.main(["--config", str(config_path)])

    assert exit_code == 1
    run_dir = next(path for path in (tmp_path / "results").iterdir() if path.is_dir())
    record = json.loads(
        (run_dir / "scenario-results.jsonl").read_text().splitlines()[0]
    )
    assert record["status"] == "benchmark_error"
    assert record["error"]["stage"] == "population"
    message = record["error"]["message"]
    assert "expected=24" in message
    assert "completed=20" in message
    assert "failed=4" in message
'''
          path.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Verify regression test is RED
        shell: bash
        run: |
          set +e
          python -m pytest benchmarks/cache/tests/test_run_suite.py -k population_result_failure -q > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo 'Regression test unexpectedly passed before implementation.'
            exit 1
          fi
          grep -Eq 'metrics collection should not start|measured benchmark should not start' /tmp/red.log
      - name: Commit RED test
        shell: bash
        run: |
          if git diff --quiet -- benchmarks/cache/tests/test_run_suite.py; then
            echo 'Regression test already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/cache/tests/test_run_suite.py
          git commit -m 'test: reject partial cache population results'
          git push origin HEAD:${GITHUB_REF_NAME}
