name: cache-workload-fix-test

on:
  pull_request:
    paths:
      - "benchmarks/cache/**"
      - ".github/workflows/cache-workload-fix-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
      - name: Install cache benchmark test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pydantic>=2.12" \
            prometheus-client \
            psutil \
            pytest \
            pyyaml \
            requests
      - name: Run cache benchmark tests except fake E2E
        run: |
          python -m pytest -q benchmarks/cache/tests \
            -k 'not test_fake_executable_end_to_end'
      - name: Run fake E2E with failure evidence
        shell: bash
        run: |
          set +e
          python -m pytest -vv -s \
            benchmarks/cache/tests/test_run_suite.py::test_fake_executable_end_to_end \
            --basetemp="$RUNNER_TEMP/cache-pytest"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== retained test files ====="
            find "$RUNNER_TEMP/cache-pytest" -type f -print | sort
            echo "===== scenario results and logs ====="
            find "$RUNNER_TEMP/cache-pytest" -type f \
              \( -name 'scenario-results.jsonl' \
              -o -name '*.stderr.log' \
              -o -name '*.stdout.log' \) \
              -exec sh -c 'echo "######## $1 ########"; cat "$1"' _ {} \;
          fi
          exit "$status"
      - name: Compile cache benchmark package
        run: python -m compileall -q benchmarks/cache
